<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Digital Channel Monitoring</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body class="bg-light">

    <div class="container">
        <div
            class="row justify-content-center align-items-center"
            style="min-height: 100vh;"
        >
            <div class="col-md-4">

                <div class="card shadow">
                    <div class="card-body p-4">

                        <h4 class="text-center mb-4">
                            Digital Channel Monitoring
                        </h4>

                        <div
                            id="alertBox"
                            class="alert alert-danger d-none"
                            role="alert"
                        ></div>

                        <form id="loginForm">

                            <div class="mb-3">
                                <label class="form-label">
                                    Email
                                </label>

                                <input
                                    type="email"
                                    class="form-control"
                                    id="email"
                                    required
                                >
                            </div>

                            <div class="mb-3">
                                <label class="form-label">
                                    Password
                                </label>

                                <input
                                    type="password"
                                    class="form-control"
                                    id="password"
                                    required
                                >
                            </div>

                            <button
                                type="submit"
                                class="btn btn-primary w-100"
                                id="loginBtn"
                            >
                                Login
                            </button>

                        </form>

                    </div>
                </div>

            </div>
        </div>
    </div>

    <script src="/static/js/login.js"></script>

</body>
</html>
