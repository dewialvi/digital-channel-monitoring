<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard - Digital Channel Monitoring</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body>

    <!-- =========================
         NAVBAR
    ========================== -->

    <nav class="navbar navbar-dark bg-dark px-3">

        <span class="navbar-brand">
            Digital Channel Monitoring
        </span>

        <div class="d-flex align-items-center">

            <span
                class="text-white me-3"
                id="userName"
            >
            </span>

            <button
                class="btn btn-outline-light btn-sm"
                id="logoutBtn"
            >
                Logout
            </button>

        </div>

    </nav>


    <!-- =========================
         MAIN LAYOUT
    ========================== -->

    <div class="container-fluid">

        <div class="row">

            <!-- SIDEBAR -->

            <nav class="col-md-2 bg-light vh-100 p-3">

                <div class="nav flex-column">

                    <a
                        href="/dashboard"
                        class="nav-link active"
                    >
                        Dashboard
                    </a>

                    <a
                        href="/bug-reports"
                        class="nav-link"
                    >
                        Bug Reports
                    </a>

                    <a
                        href="/user-feedback"
                        class="nav-link"
                    >
                        User Feedback
                    </a>

                    <a
                        href="/users"
                        class="nav-link"
                        id="menuUsers"
                    >
                        Master User
                    </a>

                </div>

            </nav>


            <!-- CONTENT -->

            <main class="col-md-10 p-4">

                <h3 class="mb-4">
                    Ringkasan
                </h3>


                <!-- STATISTICS CARDS -->

                <div
                    class="row g-3"
                    id="statsCards"
                >

                    <!-- Critical / High -->

                    <div class="col-md-3">

                        <div class="card border-danger">

                            <div class="card-body">

                                <h6 class="text-muted">
                                    Bug Critical/High
                                </h6>

                                <h3 id="statCriticalBugs">
                                    -
                                </h3>

                            </div>

                        </div>

                    </div>


                    <!-- Open Bugs -->

                    <div class="col-md-3">

                        <div class="card border-warning">

                            <div class="card-body">

                                <h6 class="text-muted">
                                    Bug Open
                                </h6>

                                <h3 id="statOpenBugs">
                                    -
                                </h3>

                            </div>

                        </div>

                    </div>


                    <!-- Closed Bugs -->

                    <div class="col-md-3">

                        <div class="card border-success">

                            <div class="card-body">

                                <h6 class="text-muted">
                                    Bug Closed
                                </h6>

                                <h3 id="statClosedBugs">
                                    -
                                </h3>

                            </div>

                        </div>

                    </div>


                    <!-- Total Feedback -->

                    <div class="col-md-3">

                        <div class="card border-primary">

                            <div class="card-body">

                                <h6 class="text-muted">
                                    Total Feedback
                                </h6>

                                <h3 id="statFeedback">
                                    -
                                </h3>

                            </div>

                        </div>

                    </div>

                </div>

            </main>

        </div>

    </div>


    <!-- JAVASCRIPT -->

    <script src="/static/js/auth-guard.js"></script>

    <script src="/static/js/dashboard.js"></script>

</body>

</html>
